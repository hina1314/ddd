name: Deploy to lab server

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      DEPLOY_SSH_KEY:
        required: true
      DEPLOY_KNOWN_HOSTS:
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-lab-server
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate deployment settings
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"

      - name: Deploy exact main commit
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/app-deploy-ssh"
          install -m 700 -d "$ssh_dir"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"

          ssh -i "$ssh_dir/key" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" "bash -se -- $DEPLOY_SHA" <<'REMOTE'
          set -euo pipefail
          sha=$1
          repo=/opt/apps/app
          if [ ! -d "$repo" ]; then
            echo "Deployment checkout is missing: $repo" >&2
            echo "Create the new checkout and install app-deploy using ops/docker/README.md before retrying." >&2
            exit 1
          fi
          if ! git -C "$repo" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            echo "$repo must contain a Git checkout of this repository." >&2
            exit 1
          fi
          if [ ! -x /usr/local/sbin/app-deploy ]; then
            echo "Missing deployment helper: install ops/docker/deploy.sh as /usr/local/sbin/app-deploy." >&2
            exit 1
          fi
          for file in .env postgres.env app.env; do
            if [ ! -f "$repo/ops/docker/$file" ]; then
              echo "Missing server config: $repo/ops/docker/$file. Run prepare.sh once and configure APP_IMAGE." >&2
              exit 1
            fi
          done
          cd "$repo"
          old_sha=$(git rev-parse HEAD)
          test -z "$(git status --porcelain --untracked-files=all)"
          git fetch origin main:refs/remotes/origin/main
          if [ "$(git rev-parse origin/main)" != "$sha" ]; then
            echo "main has advanced; skipping superseded commit $sha"
            exit 0
          fi
          git checkout --detach "$sha"
          if ! sudo -n /usr/local/sbin/app-deploy "$sha"; then
            git checkout --detach "$old_sha" || true
            exit 1
          fi
          REMOTE
