name: Deploy to lab server

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-lab-server
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate deployment settings
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"

      - name: Deploy exact main commit
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/study-deploy-ssh"
          install -m 700 -d "$ssh_dir"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"

          ssh -i "$ssh_dir/key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" "bash -se -- $DEPLOY_SHA" <<'REMOTE'
          set -euo pipefail
          sha=$1
          repo=/opt/apps/ddd
          cd "$repo"
          old_sha=$(git rev-parse HEAD)
          test -z "$(git status --porcelain --untracked-files=all)"
          git fetch origin main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$sha"
          git checkout --detach "$sha"
          if ! sudo -n /usr/local/sbin/study-deploy "$sha"; then
            git checkout --detach "$old_sha" || true
            exit 1
          fi
          REMOTE
