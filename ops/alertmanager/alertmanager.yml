global:
  resolve_timeout: 1m

route:
  receiver: local-webhook
  group_by:
    - alertname
    - service
    - environment
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 1h

receivers:
  - name: local-webhook

    webhook_configs:
      - url: http://127.0.0.1:5001/alerts
        send_resolved: true