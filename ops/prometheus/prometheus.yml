global:
  scrape_interval: 5s
  scrape_timeout: 2s
  evaluation_interval: 5s

rule_files:
  - "rules/*.yml"

alerting:
  alertmanagers:
    - scheme: http

      static_configs:
        - targets:
            - 127.0.0.1:9093

scrape_configs:
  - job_name: study-api
    metrics_path: /metrics

    static_configs:
      - targets:
          - 127.0.0.1:3000

        labels:
          environment: local