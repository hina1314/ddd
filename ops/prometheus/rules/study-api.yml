groups:
  - name: study-api-alerts
    interval: 5s

    rules:
      - alert: StudyAPIHigh5xxErrorRate

        expr: |
          (
            sum(rate(study_http_requests_total{
              job="study-api",
              status=~"5.."
            }[1m]))
            /
            sum(rate(study_http_requests_total{
              job="study-api"
            }[1m]))
          ) > 0.20
          and
          sum(increase(study_http_requests_total{
            job="study-api"
          }[1m])) >= 10

        for: 15s

        labels:
          severity: warning
          service: study-api

        annotations:
          summary: "study-api 5xx error rate is high"
          description: "5xx error rate exceeded 20% for 15 seconds."


      - alert: StudyAPIDown

        expr: up{job="study-api"} == 0

        for: 15s

        labels:
          severity: critical
          service: study-api

        annotations:
          summary: "study-api is unreachable"
          description: "{{ $labels.instance }} has been unreachable for 15 seconds."
          runbook: "ops/runbooks/study-api-down.md"
